<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="keywords"><meta name="descriptioon" content=""><meta name="renderer" content="wekit"><link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon"><link rel="stylesheet" href="/css/public.css"><link rel="stylesheet" href="/css/reset.css"><link rel="stylesheet" href="/css/iconfont.css"><title>小球反弹 [ Wuruiyi's Blog ]</title><link rel="stylesheet" href="/css/partial/footer.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css"><link rel="stylesheet" href="/css/partial/sidebar.css"><link rel="stylesheet" href="/css/post.css"><link rel="stylesheet" href="https://imsun.github.io/gitment/style/default.css"><meta name="generator" content="Hexo 7.3.0"></head><body><link rel="stylesheet" href="/css/partial/header.css"><div class="header"><div class="maxwidth"><div class="nav"><a id="artlist" href="/404"><i class="iconfont icon404"></i><span class="headhid">&nbsp;404</span></a><a id="artlist" href="/archives"><i class="iconfont iconarchives"></i><span class="headhid">&nbsp;Archives</span></a><a id="artlist" href="/link"><i class="iconfont iconlink"></i><span class="headhid">&nbsp;Link</span></a><a id="artlist" href="/about"><i class="iconfont iconabout"></i><span class="headhid">&nbsp;About</span></a></div><a class="search" href="/">HELLO</a></div></div><div class="main"> <div class="maxwidth"><link rel="stylesheet" href="/css/partial/sidebar.css"><div id="sidebar"><div class="social"><a href="/archives" title="Home"><i class="iconfont iconHome"></i></a><a href="mailto:1509989070@qq.com" title="E-Mail"><i class="iconfont iconweibiaoti554"></i></a><a target="_blank" rel="noopener" href="https://github.com/wuruiyii" title="GitHub"><i class="iconfont iconGitHub"></i></a><a target="_blank" rel="noopener" href="https://juejin.cn/user/2619479630028523" title="juejin"><img src="/images/juejinicon-sidebar.png"></a><a target="_blank" rel="noopener" href="https://www.jianshu.com/u/558fe23049c7" title="jianshu"><img src="/images/jianicon-sidebar.png"></a></div><div class="tags"></div></div><div class="post rightside"><h1 class="artititle">小球反弹</h1><div class="info"><i class="iconfont iconshijian"><span title="文章发布时间">2025-02-22</span></i></div><div class="postDetail"><p><img src="/2025/02/22/%E5%B0%8F%E7%90%83%E5%8F%8D%E5%BC%B9/%E5%B1%8F%E5%B9%95%E6%88%AA%E5%9B%BE%202025-02-22%20110456.png"></p>
<p>本题可以用一个<strong>扩展</strong>的思路，将反弹的射线不再单纯的在一小格之内进行反射，而是将射线扩展开，不断地补小格子，让射线一直延展，直到射线展开到右下角，然后再反弹回来（乘以2）即可。</p>
<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span><span class="string">&lt;bits/stdc++.h&gt;</span></span></span><br><span class="line"><span class="keyword">using</span> <span class="keyword">namespace</span> std;</span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span></span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">    <span class="type">long</span> <span class="type">long</span> x = <span class="number">343720</span>,y = <span class="number">233333</span>,t = <span class="number">1</span>;</span><br><span class="line">    <span class="keyword">while</span>(<span class="number">1</span>)</span><br><span class="line">    &#123;</span><br><span class="line">        <span class="keyword">if</span>((<span class="number">15</span>*t) % x == <span class="number">0</span> &amp;&amp; (<span class="number">17</span>*t) % y == <span class="number">0</span>) <span class="comment">//走了恰好成倍数的长和恰好成倍数的宽</span></span><br><span class="line">            <span class="keyword">break</span>;</span><br><span class="line">        t++;                     </span><br><span class="line">    &#125;</span><br><span class="line">    <span class="comment">//找到延展到右下角的最小t</span></span><br><span class="line">    <span class="type">double</span> s = <span class="number">2</span>*<span class="built_in">sqrt</span>(<span class="number">15</span>*<span class="number">15</span>*t*t<span class="number">+17</span>*<span class="number">17</span>*t*t); <span class="comment">//反弹回来要乘以2</span></span><br><span class="line">    </span><br><span class="line">    cout&lt;&lt;fixed&lt;&lt;<span class="built_in">setprecision</span>(<span class="number">2</span>)&lt;&lt;s;</span><br><span class="line">    <span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>





<figure class="highlight c++"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br></pre></td><td class="code"><pre><span class="line"><span class="meta">#<span class="keyword">include</span><span class="string">&lt;iostream&gt;</span></span></span><br><span class="line"><span class="meta">#<span class="keyword">include</span><span class="string">&lt;iomanip&gt;</span></span></span><br><span class="line"><span class="keyword">using</span> <span class="keyword">namespace</span> std;</span><br><span class="line"><span class="keyword">typedef</span> <span class="type">long</span> <span class="type">long</span> ll;</span><br><span class="line"><span class="function">ll <span class="title">gong</span><span class="params">(ll a, ll b)</span></span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">	<span class="keyword">if</span> (a % b == <span class="number">0</span>)</span><br><span class="line">		<span class="keyword">return</span> b;</span><br><span class="line">	<span class="keyword">else</span></span><br><span class="line">	<span class="keyword">return</span> <span class="built_in">gong</span>(b, a % b);</span><br><span class="line">&#125;</span><br><span class="line"></span><br><span class="line"><span class="function"><span class="type">int</span> <span class="title">main</span><span class="params">()</span></span></span><br><span class="line"><span class="function"></span>&#123;</span><br><span class="line">	ll length = <span class="number">343720</span>, width = <span class="number">233333</span>;</span><br><span class="line">	ll dy = <span class="number">17</span>, dx = <span class="number">15</span>;</span><br><span class="line">	ll y = <span class="built_in">gong</span>(length * dy, width * dx);</span><br><span class="line">	ll a = (length * dy * width) / y;</span><br><span class="line">	ll b = (width * dx * length) / y;</span><br><span class="line">	<span class="type">double</span> s = <span class="number">2</span> * <span class="built_in">sqrt</span>(a * a + b * b);</span><br><span class="line">	cout &lt;&lt;fixed&lt;&lt;<span class="built_in">setprecision</span>(<span class="number">2</span>)&lt;&lt; s &lt;&lt; endl;</span><br><span class="line">	<span class="keyword">return</span> <span class="number">0</span>;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>



<p><img src="/2025/02/22/%E5%B0%8F%E7%90%83%E5%8F%8D%E5%BC%B9/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20250222151547.jpg" alt="微信图片_20250222151547"></p>
<p>一个错误的思路：简单利用反射原理进行讨论，错误的认为要反射要右上角，再原路返回，中间长度对半除开就可以计算出来路程，并且乘以4就可以算出来总路程</p>
